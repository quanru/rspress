name: Midscene migration benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: midscene-e2e
  cancel-in-progress: false
jobs:
  benchmark:
    name: Comparison round ${{ matrix.round }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment:
      name: Model
      deployment: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        round: [1, 2, 3]
    env:
      CI: 'true'
      HEADLESS: 'true'
      NODE_OPTIONS: '--dns-result-order=ipv4first --no-network-family-autoselection'
      BENCHMARK_ROUND: ${{ matrix.round }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: web-infra-dev/rspress
          ref: e594d85f22a7914e7fd392fc4981de88ad2feb39
          persist-credentials: false
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7fb151b79dfec045f1001a8e6673f80eed9a6825
          persist-credentials: false
          path: candidate
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Prepare baseline
        working-directory: baseline
        run: |
          node ../harness/tests/benchmark/measure.mjs baseline-setup pnpm install --frozen-lockfile --ignore-scripts
          node ../harness/tests/benchmark/measure.mjs baseline-build pnpm build
          node ../harness/tests/benchmark/measure.mjs baseline-website pnpm --filter @rspress/docs run build
          pnpm exec playwright install --with-deps chromium
      - name: Original deterministic E2E, no retries
        id: baseline
        continue-on-error: true
        working-directory: baseline
        run: node ../harness/tests/benchmark/measure.mjs baseline-e2e timeout --signal=TERM --kill-after=10s 20m pnpm exec rstest run --config rstest.e2e.config.mts --retry 0 --reporter json
      - name: Prepare candidate
        working-directory: candidate
        run: |
          node ../harness/tests/benchmark/measure.mjs candidate-setup pnpm install --frozen-lockfile --ignore-scripts
          node ../harness/tests/benchmark/measure.mjs candidate-build pnpm build
          node ../harness/tests/benchmark/measure.mjs candidate-website pnpm --filter @rspress/docs run build
          pnpm exec playwright install --with-deps chromium
      - name: Retained deterministic E2E, no retries
        id: candidate
        continue-on-error: true
        working-directory: candidate
        run: node ../harness/tests/benchmark/measure.mjs candidate-e2e timeout --signal=TERM --kill-after=10s 20m pnpm exec rstest run --config rstest.e2e.config.mts --retry 0 --reporter json
      - name: Install Midscene
        working-directory: candidate/tests/midscene
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run collect
      - name: Verify configured model
        working-directory: candidate/tests/midscene
        env:
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ vars.MIDSCENE_MODEL_NAME || secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ vars.MIDSCENE_MODEL_BASE_URL || secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ vars.MIDSCENE_MODEL_FAMILY || secrets.MIDSCENE_MODEL_FAMILY }}
        run: npm run check:model
      - name: All 153 AI cases, no retries
        id: ai
        continue-on-error: true
        working-directory: candidate/tests/midscene
        env:
          MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
          MIDSCENE_MODEL_NAME: ${{ vars.MIDSCENE_MODEL_NAME || secrets.MIDSCENE_MODEL_NAME }}
          MIDSCENE_MODEL_BASE_URL: ${{ vars.MIDSCENE_MODEL_BASE_URL || secrets.MIDSCENE_MODEL_BASE_URL }}
          MIDSCENE_MODEL_FAMILY: ${{ vars.MIDSCENE_MODEL_FAMILY || secrets.MIDSCENE_MODEL_FAMILY }}
          MIDSCENE_REPLANNING_CYCLE_LIMIT: '40'
          MIDSCENE_RETRY: '0'
        run: node ../../../harness/tests/benchmark/measure.mjs candidate-ai timeout --signal=TERM --kill-after=10s 220m npm test
      - name: Upload raw measurements and native reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: comparison-round-${{ matrix.round }}
          include-hidden-files: true
          retention-days: 30
          path: |
            measurements/
            candidate/tests/midscene/.midscene/
            candidate/tests/midscene/midscene_run/
      - name: Preserve test failures
        if: always()
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          CANDIDATE: ${{ steps.candidate.outcome }}
          AI: ${{ steps.ai.outcome }}
        run: |
          test "$BASELINE" = success
          test "$CANDIDATE" = success
          test "$AI" = success
